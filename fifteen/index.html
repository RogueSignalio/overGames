<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phaser Fifteen: Tile-Based</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; color: #fff; font-family: sans-serif; }
  /* The game fills whatever box it is placed in, so give #game any size you like.
     (resize: both lets you drag the corner in a desktop browser to try it live.) */
  #game { width: 80vmin; height: 80vmin; min-width: 200px; min-height: 200px; resize: both; overflow: hidden;
          border: 2px solid #555; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
  #game canvas { display: block; }
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@v3.90.0/dist/phaser.min.js" crossorigin="anonymous"></script>
<script src="./fifteen_gen.js"></script>
<script src="./fifteen.js"></script>
</head>
<body>
<div id="game"></div>
<script>
let game = null
let maps = []
let map_configs = [
  { columns: 3, rows: 3, seed: 'quack-1' },
  { columns: 4, rows: 4, seed: 'quack-2' },
  { columns: 5, rows: 4, seed: 'quack-3' },   // shuffle_moves: 200 would make it harder
]

map_configs.forEach((mcfg) => {
  let gen = new FifteenMapGenerator(mcfg)
  maps.push(gen.generate())   // { map, solution, goal }
})

try {
  game = new FifteenGame({
    map: null,
    maps: maps,
    responsive: true,        // false = fixed size, using tile_size below
    // max_tile_size: 120,   // optional cap on how big tiles may grow
    tile_size: 64,           // only used when responsive is false
    slide_ms: 120,           // tile slide time, 0 = instant
    highlight_correct: false, // true = tiles already in place use the tile_ok image
    theme: {
      path: 'assets/default/',      // try 'assets/light/'
      background: 'background.png', // set to null for a plain color
      background_color: '#222222',
    },
    win_callback: (t) => {
      console.log(`${t.submit}`)
    },
    debug: false,   // true = print each level's solution to the console, 'full' = every board too
  },
  {
    parent: 'game',
  })
  // game.play_solution(300)   // run in the console to watch the stored solution being played
} catch (e) {
  console.error(e.message)
}
</script>
</body>
</html>
