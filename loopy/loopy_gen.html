<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loopy Map Generator Test</title>
<style>
  body { margin: 0; background: #222; color: #fff; font-family: sans-serif; padding: 20px; }
  label { margin-right: 12px; }
  input { width: 70px; }
  pre { font-size: 18px; line-height: 1.1; display: inline-block; margin: 14px 40px 0 0; vertical-align: top; }
  #info { margin-top: 12px; color: #aaa; }
</style>
<script src="./loopy_gen.js"></script>
</head>
<body>
<h3>Loopy generator</h3>
<label>Columns <input id="cols" type="number" value="8" min="2" max="20"></label>
<label>Rows <input id="rows" type="number" value="8" min="2" max="20"></label>
<label>Fill % <input id="fill" type="number" value="55" min="30" max="80"></label>
<label>Winding <input id="wind" type="number" value="0.3" min="0" max="1" step="0.1"></label>
<label>Seed <input id="seed" type="text" value="quack"></label>
<label>Difficulty
  <select id="diff"><option value="easy">easy</option><option value="hard">hard</option></select>
</label>
<button id="go">Generate</button>
<div id="info"></div>
<pre id="puzzle"></pre><pre id="solution"></pre>
<script>
function run() {
  const gen = new LoopyMapGenerator({
    columns: +document.getElementById('cols').value,
    rows: +document.getElementById('rows').value,
    fill_percent: +document.getElementById('fill').value,
    winding: +document.getElementById('wind').value,
    difficulty: document.getElementById('diff').value,
    seed: document.getElementById('seed').value || null,
  })
  const t0 = performance.now()
  const result = gen.generate()
  const ms = Math.round(performance.now() - t0)

  const a = LoopyMapGenerator.analyze(result.map, result.solution)
  const found = LoopyMapGenerator.solve(result.map, 2, { max_nodes: 200000 })
  const clues = result.map.flat().filter(v => v >= 0).length
  const by_deduction = LoopyMapGenerator.solve(result.map, 2, { guess: false }).count === 1

  document.getElementById('puzzle').textContent = 'Puzzle\n\n' + LoopyMapGenerator.to_text(result.map)
  document.getElementById('solution').textContent = 'Solution\n\n' + LoopyMapGenerator.to_text(result.map, result.solution)
  document.getElementById('info').textContent =
    `Generated in ${ms} ms. ${clues} numbers. Solution valid: ${a.solved} (${a.lines} lines). ` +
    (found.aborted ? 'Uniqueness check ran out of budget. ' : `Solver found ${found.count === 1 ? 'exactly one solution' : 'more than one solution'}. `) +
    `Solvable by deduction alone: ${by_deduction}.`
  console.log(result)
}
document.getElementById('go').onclick = run
run()
</script>
</body>
</html>
